<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>RPi Cam Multiview</title>
	<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
	<style>
		/* Shows up to four cameras configured in multiview.json (copy multiview.jsonD to start) */
		html, body { margin: 0; height: 100%; background: #0a0c0f; color: #e8ebf0; font: 14px/1.4 system-ui, sans-serif; }
		.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr)); gap: 6px; padding: 6px; min-height: 100%; box-sizing: border-box; }
		a { position: relative; display: block; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; }
		img { width: 100%; height: 100%; object-fit: contain; display: block; }
		span { position: absolute; left: 10px; top: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.55); font-weight: 600; }
	</style>
</head>
<body>
	<div class="grid" id="grid"></div>
	<script>
		(function () {
			var grid = document.getElementById('grid');
			for (var i = 0; i < 4; i++) {
				var a = document.createElement('a');
				a.href = 'multiview.php?rHost=' + i;
				a.innerHTML = '<img alt=""><span>Cam ' + (i + 1) + '</span>';
				grid.appendChild(a);
				(function (img, a, i) {
					img.onerror = function () { a.hidden = true; };
					img.src = 'multiview.php?time=' + Date.now() + '&pHost=' + i;
				})(a.firstChild, a, i);
			}
		})();
	</script>
</body>
</html>
